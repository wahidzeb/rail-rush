*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Baloo",ui-rounded,"Nunito","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;font-weight:800}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
body:not(.ads-on) .adslot{display:none!important}
.adslot{min-height:90px;width:100%;max-width:340px;margin:150px auto 10px;border-radius:12px;background:rgba(0,0,0,.06)}
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.screen.dim{background:rgba(20,10,40,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:12px;margin:auto 0}
.screen .wrap>*{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:8px 24px 12px;border-radius:18px;font-size:22px;color:#fff;background:linear-gradient(180deg,var(--c1,#ff9a6b),var(--c2,#ff6b4a));box-shadow:0 5px 0 var(--c3,#b8321a),0 9px 18px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c3,#b8321a),0 3px 8px rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.4)}
.btn.g{--c1:#74e597;--c2:#33c065;--c3:#18793c}.btn.y{--c1:#ffe07a;--c2:#ffbf2e;--c3:#b87600;color:#6b3a00;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.b{--c1:#8cc2ff;--c2:#4c93f5;--c3:#2556a8}.btn.p{--c1:#c9a4ff;--c2:#9b63f5;--c3:#5a32a8}.btn.w{--c1:#fff;--c2:#f1ecf6;--c3:#cdbfdc;color:var(--ink);text-shadow:none}
.btn.big{min-height:68px;font-size:32px;padding:8px 48px 14px;border-radius:22px}
.btn.sm{min-height:44px;font-size:18px;padding:6px 16px 9px;border-radius:14px}
.btn[disabled]{filter:grayscale(.85);opacity:.6}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.panel{width:100%;background:rgba(255,255,255,.94);border-radius:22px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.1),0 14px 30px rgba(0,0,0,.18);color:var(--ink)}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h2{font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.ib{width:50px;height:50px;min-height:50px;padding:0;border-radius:16px;font-size:24px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);color:#fff;border-radius:999px;padding:4px 14px 6px;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 40%,#e09a00);box-shadow:inset 0 -2px 0 rgba(150,80,0,.5),0 1px 0 rgba(0,0,0,.2)}
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;font-size:19px;border-bottom:2px solid rgba(0,0,0,.06)}
.set:last-child{border:0}
.seg{display:flex;background:rgba(0,0,0,.08);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:16px;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:60;background:rgba(30,20,60,.92);color:#fff;padding:10px 18px;border-radius:16px;font-size:18px;pointer-events:none;animation:pop .35s both;text-align:center;max-width:90vw}
.help p{font-size:17px;line-height:1.35;margin:6px 0}
.byline{font-size:20px;color:#fff;opacity:.95;text-shadow:0 2px 0 rgba(0,0,0,.25);margin-top:-8px}
.stars{display:flex;gap:6px;justify-content:center}
.stars i{width:54px;height:54px;display:block;background:no-repeat center/contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
@media (orientation:landscape) and (max-height:500px){.wrap{max-width:640px;gap:8px}.btn.big{min-height:56px;font-size:26px}.topbar h2{font-size:24px}}
:root{--bg:#2f7a45;--ink:#33244d}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23d 45%,#d99a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.3);vertical-align:-3px;position:relative}
.coin:after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid rgba(180,110,0,.45)}
#hud{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);display:flex;align-items:center;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.ib{width:46px;height:46px;border-radius:14px;background:linear-gradient(180deg,#fff,#e8e2f2);box-shadow:0 4px 0 #b9acd0,0 6px 12px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #b9acd0}
.pz{width:14px;height:16px;border-left:5px solid #5a3fa0;border-right:5px solid #5a3fa0}
.hl{flex:1;max-width:360px;margin:0 auto;background:rgba(30,20,50,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:16px;padding:5px 12px 7px;color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;border:2px solid rgba(255,255,255,.18)}
.hl b{font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.3)}.hl small{font-size:14px;opacity:.9}
.prog{height:12px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}
.prog i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(180deg,#a6ff8f,#3fd36b);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width .35s cubic-bezier(.2,1.4,.4,1)}
.hc{background:rgba(30,20,50,.55);border-radius:16px;padding:8px 12px;color:#ffe14d;font-size:18px;display:flex;gap:6px;align-items:center;border:2px solid rgba(255,255,255,.18);min-width:76px;justify-content:center}
#bWhistle{position:fixed;z-index:10;left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3f4ff,#7cc2ff 55%,#3d7fd6);box-shadow:0 5px 0 #24539a,0 8px 16px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.6);font-size:26px;display:flex;align-items:center;justify-content:center}
#bWhistle em{position:absolute;right:-4px;top:-4px;background:#ff5a5a;color:#fff;font-style:normal;font-size:14px;min-width:22px;height:22px;border-radius:11px;line-height:22px;box-shadow:0 2px 0 #a52a2a}
#bWhistle.off{filter:grayscale(1);opacity:.55}
#bWhistle:active{transform:translateY(3px)}
#tip{position:fixed;z-index:11;left:0;right:0;margin:0 auto;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(92vw,420px);text-align:center;background:rgba(255,255,255,.95);color:var(--ink);padding:8px 14px;border-radius:16px;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:pop .4s both;pointer-events:none}
#tip b{color:#ff6b2e}
#banner{position:fixed;z-index:12;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;animation:ban 1.9s both}
#banner b{display:block;font-size:52px;line-height:1;text-shadow:0 4px 0 #5a3fa0,0 8px 20px rgba(0,0,0,.35);-webkit-text-stroke:2px #5a3fa0}
#banner span{display:inline-block;margin-top:6px;font-size:18px;background:rgba(30,20,50,.6);padding:3px 14px;border-radius:12px}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
#scrTitle{background:radial-gradient(ellipse at 50% 40%,rgba(20,10,40,.05),rgba(20,10,40,.45))}
.title{gap:10px}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.82;font-weight:800;letter-spacing:2px;filter:drop-shadow(0 8px 0 rgba(60,20,100,.55)) drop-shadow(0 14px 22px rgba(0,0,0,.35))}
.logo span{font-size:min(28vw,124px);background:linear-gradient(180deg,#fff7b0 10%,#ffd23d 45%,#ff8c2e 90%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 6px}
.logo>span{filter:drop-shadow(3px 0 0 #5a2a8a) drop-shadow(-3px 0 0 #5a2a8a) drop-shadow(0 3px 0 #5a2a8a) drop-shadow(0 -3px 0 #5a2a8a)}
.logo .b{background:linear-gradient(180deg,#ffffff 5%,#9cceff 45%,#3d7fd6 95%);-webkit-background-clip:text;background-clip:text;transform:rotate(-3deg);margin-top:-4px}
.logo{animation:float 3s ease-in-out infinite!important}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tag{color:#fff;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center}
.byline{color:#ffe14d;font-size:17px;background:rgba(30,20,50,.55);padding:2px 14px;border-radius:12px}
.tcoins{color:#ffe14d;font-size:20px;display:flex;gap:6px;align-items:center;background:rgba(30,20,50,.5);padding:4px 14px;border-radius:14px}
.btn.g.big{animation:pop .45s both,breathe 1.6s ease-in-out .6s infinite!important}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.wrap.wide{max-width:560px}
.topbar h2{flex:1;text-align:center}
.pill{background:rgba(30,20,50,.55);color:#ffe14d;border-radius:14px;padding:6px 12px;font-size:17px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.tabs{display:flex;gap:6px;width:100%}
.tab{flex:1;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.25);color:#fff;font-size:14px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.tab.on{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 4px 0 rgba(0,0,0,.2)}.tab.lk{opacity:.6}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
.lv{aspect-ratio:1/1;border-radius:18px;background:linear-gradient(180deg,#fff,#eae4f5);box-shadow:0 5px 0 #b9acd0,0 8px 14px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);gap:2px;max-height:86px}
.lv b{font-size:26px;line-height:1}.lv span{display:flex;gap:2px}
.lv i,.stars i{width:13px;height:13px;background:#cfc6dd;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.lv i.y,.stars i.y{background:linear-gradient(180deg,#fff2a0,#ffc21d)}
.lv.cur{background:linear-gradient(180deg,#b8ff9f,#4fd06e);box-shadow:0 5px 0 #23893f,0 0 0 3px #fff,0 8px 18px rgba(0,0,0,.25);animation:breathe 1.4s infinite}
.lv.lk{opacity:.55}.lv:active{transform:translateY(3px)}
#shopBox h3{font-size:19px;margin:4px 0 8px}
.it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:#f4f0fa;margin-bottom:8px}
.it .ic{font-size:30px;width:44px;text-align:center}.it .tx{flex:1;display:flex;flex-direction:column;line-height:1.15}.it small{font-size:13px;opacity:.7;font-weight:600}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:16px;height:7px;border-radius:4px;background:#d8cfe6}.pips i.on{background:#3fd36b}
.it .btn{min-width:84px}.it .btn .coin{margin-right:2px}
.sk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.skn{border-radius:14px;background:#f4f0fa;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;color:var(--ink)}
.skn canvas{width:100%;max-width:110px;height:auto}.skn b{font-size:13px;line-height:1.1;text-align:center}.skn small{font-size:12px;opacity:.75}
.skn.on{border-color:#3fd36b;background:#eafff0}.skn[disabled]{opacity:.5}
@media (max-width:420px){.sk{grid-template-columns:repeat(2,1fr)}}
.panel.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#scrEnd .wrap,#scrPause .wrap{max-width:380px}
.panel h2{font-size:34px;color:#5a3fa0}
.col{display:flex;flex-direction:column;gap:12px;width:80%}
.stars{display:flex;gap:10px;justify-content:center}.stars i{width:58px;height:58px}
.stars i.y{animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d);filter:drop-shadow(0 3px 0 #c98f00)}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.res{display:flex;gap:16px;font-size:19px;justify-content:center;flex-wrap:wrap}.hint{font-size:14px;opacity:.75;font-weight:600}
@media (orientation:landscape) and (max-height:500px){
 .logo span{font-size:min(17vh,80px)}.title{gap:6px}.tag{font-size:16px}.btn.big{min-height:56px;font-size:26px}
 .grid{grid-template-columns:repeat(10,1fr);gap:6px}.lv b{font-size:20px}.lv i{width:9px;height:9px}.wrap.wide{max-width:640px;gap:8px}
 .stars i{width:44px;height:44px}.panel h2{font-size:26px}.panel.center{gap:6px;padding:10px 14px}.sk{grid-template-columns:repeat(4,1fr)}
 #shopBox{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px}.wrap.wide:has(#shopBox){max-width:760px}#shopBox h3{margin:0 0 6px;font-size:16px}.it{padding:5px 8px;margin-bottom:6px}.it .ic{font-size:24px;width:32px}.skn canvas{max-width:80px}
 #tip{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
}

/* v2 UI art */
.panel{background:linear-gradient(180deg,#fffdf8,#f3ecdf);border:3px solid #fff;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,#8a5d36 0 6px,transparent 6px 14px),linear-gradient(180deg,#b9c2d0 0 2px,transparent 2px 7px,#b9c2d0 7px 9px);opacity:.75}
.panel.center:after{content:"";position:absolute;left:-12px;right:-12px;top:50%;border-top:2px dashed rgba(90,63,160,.15);pointer-events:none}
.hl b:before{content:"🚂 ";font-size:15px}
.hl,.hc,.pill{background:linear-gradient(180deg,rgba(60,40,100,.72),rgba(25,15,45,.78));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 10px rgba(0,0,0,.25)}
#scrTitle:before{content:"";position:fixed;inset:0;background:repeating-conic-gradient(from var(--a,0deg) at 50% 36%,rgba(255,240,180,.11) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle at 50% 36%,#000 10%,transparent 55%);mask:radial-gradient(circle at 50% 36%,#000 10%,transparent 55%);pointer-events:none;z-index:-1}
.title{position:relative;isolation:isolate}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{background:linear-gradient(90deg,transparent,rgba(30,20,50,.55) 15%,rgba(30,20,50,.55) 85%,transparent);padding:3px 28px}
.lv{position:relative;overflow:visible;border-top:6px solid var(--wc,#3fae5a)}
.lv:before{content:"";position:absolute;left:50%;top:-14px;margin-left:-14px;border:14px solid transparent;border-bottom:8px solid var(--wc,#3fae5a);border-top:0}
.lv.lk{border-top-color:#a99fbb}.lv.lk:before{border-bottom-color:#a99fbb}
.grid{padding-top:10px;row-gap:22px}
.btn:after{content:"";position:absolute;left:10%;right:10%;top:5px;height:36%;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.stars i.y{filter:drop-shadow(0 3px 0 #c98f00) drop-shadow(0 0 10px rgba(255,210,60,.8))}
#scrTitle{isolation:isolate}

<canvas id="cv"></canvas>
<div id="hud" class="hidden">
 <button class="ib" id="bPause" aria-label="Pause"><i class="pz"></i></button>
 <div class="hl"><b id="hLv">Level 1</b><div class="prog"><i id="hBar"></i></div><small id="hCnt">0/0</small></div>
 <div class="hc"><i class="coin"></i><b id="hCoins">0</b></div>
</div>
<button id="bWhistle" class="hidden" aria-label="Slow motion"><span>⏱️</span><em id="whN">1</em></button>
<div id="tip" class="hidden"></div>
<div id="banner" class="hidden"></div>

<div id="scrTitle" class="screen hidden">
 <div class="wrap title">
  <h1 class="logo" style="--i:0"><span class="a">RAIL</span><span class="b">RUSH</span></h1>
  <div class="tag" style="--i:1">Switch the tracks, match the colours!</div>
  <div class="byline" style="--i:1">by Zaib</div>
  <button class="btn g big" id="bPlay" style="--i:2">▶ Play</button>
  <div class="row" style="--i:3"><button class="btn y sm" id="bShop">🚂 Engines &amp; Upgrades</button><button class="btn w sm" id="bSnd">🔊 Sound</button></div>
  <div class="tcoins" style="--i:4"><i class="coin"></i><b id="tCoins">0</b></div>
 </div>
</div>
<div id="scrMap" class="screen dim hidden">
 <div class="wrap wide">
  <div class="topbar"><button class="btn w sm" id="mBack">◀</button><h2>Levels</h2><div class="pill">⭐ <b id="mStars">0</b></div><div class="pill"><i class="coin"></i><b id="mCoins">0</b></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <button class="btn y sm" id="mShop">🚂 Engines &amp; Upgrades</button>
 </div>
</div>
<div id="scrShop" class="screen dim hidden">
 <div class="wrap wide">
  <div class="topbar"><button class="btn w sm" id="sBack">◀</button><h2>Depot</h2><div class="pill"><i class="coin"></i><b id="sCoins">0</b></div></div>
  <div class="panel" id="shopBox"></div>
 </div>
</div>
<div id="scrPause" class="screen dim hidden">
 <div class="wrap"><div class="panel center"><h2>Paused</h2><div class="col"><button class="btn g" id="pResume">▶ Resume</button><button class="btn b sm" id="pRestart">↻ Restart</button><button class="btn w sm" id="pMap">Levels</button></div></div></div>
</div>
<div id="scrEnd" class="screen dim hidden">
 <div class="wrap"><div class="panel center" id="endBox"></div></div>
</div>
